# CI: build + test on a clean Node 24 Linux runner, plus focused native
# dependency install smoke coverage on Linux, Windows, and macOS.
#
# WHY THIS IS PINNED THE WAY IT IS (better-sqlite3 native binary):
#
#   better-sqlite3 is the only native/compiled dependency. Its install script
#   is `prebuild-install || node-gyp rebuild`: by default it first tries to
#   download a precompiled `.node` binary matching the Node ABI
#   (NODE_MODULE_VERSION), falling back to compiling from source with
#   node-gyp + a C/C++ toolchain (MSVC / build-essential / Xcode CLT) only if
#   no prebuild is available.
#
#   STRATEGY (primary path = compile from source; ADR 0016):
#   The root `.npmrc` sets `build-from-source=true`, so every `npm ci`/
#   `npm install` in this repo -- contributor machines, this workflow, and
#   release CI -- compiles better-sqlite3 from source instead of downloading
#   a prebuild-install prebuilt binary. This decouples the install path from
#   `prebuild-install`'s continued operation (it is deprecated upstream with
#   no maintained successor) and from whether upstream ever ships a Node-24
#   prebuild for a given `better-sqlite3` release. The tradeoff, accepted by
#   ADR 0016: every install now requires a working C/C++ toolchain, and there
#   is currently no automatic fallback to a downloaded prebuild if the
#   compile fails (better-sqlite3's install script cannot be reordered
#   without custom wrapper tooling, which ADR 0016 leaves as a future option
#   rather than requiring now).
#   - Run the full build/test gate on Node 24 LTS.
#   - Run focused install/smoke coverage on Node 24 LTS across Linux, Windows,
#     and macOS (the CLI is not Linux-only) and assert the log shows genuine
#     evidence of a source compile, not a silently-downloaded prebuild.
#   - Use better-sqlite3 12.x on Node 24, per ADR 0008.
#
#   NODE SUPPORT DECISION (intentional, documented):
#   ADR 0008 makes Node 24 LTS the supported runtime. The root and workspace
#   package engines stay at >=24 <25, CI uses Node 24, and better-sqlite3 stays
#   on the 12.x line for Node 24. ADR 0016 layers the source-build-first
#   install policy above that pin.
#
#   TOOLCHAIN MISSING LOCALLY? See AGENTS.md "Build & Test" -> better-sqlite3
#   native binary, and README.md prerequisites, for what to install.

name: CI

on:
  push:
  pull_request:

# Least-privilege GITHUB_TOKEN: CI only needs to check out the repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run typecheck` is `tsc --build --force`. The plain `build`
      # (`tsc --build`) is incremental and keys off committed-state-independent
      # tsbuildinfo; --force guarantees a deterministic full build and avoids a
      # stale-incremental false green (see bead loreweaver-2l0).
      - name: Build / typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: CLI install smoke
        run: npm run smoke:cli-install

      - name: Biome check (format + lint)
        run: npm run check

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and check native install path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $npmOutput = npm ci --foreground-scripts 2>&1
          $npmExit = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorActionPreference

          $npmOutput | Tee-Object -FilePath npm-ci.log
          if ($npmExit -ne 0) {
            exit $npmExit
          }

          # ADR 0016: the root .npmrc sets build-from-source=true, so every
          # install must compile better-sqlite3 from source. Fail if the log
          # instead shows a downloaded prebuilt binary (the policy silently not
          # taking effect), and fail if it shows no evidence of a real compile
          # (defense-in-depth against a silently-cached or skipped build).
          $log = Get-Content npm-ci.log -Raw

          if ($log -match "(?m)^.*Successfully installed prebuilt binary!") {
            Write-Error "npm ci log shows a downloaded better-sqlite3 prebuilt binary, but ADR 0016 requires build-from-source=true to take effect"
            exit 1
          }

          $sourceBuildEvidence = @(
            "(?m)^gyp info ok",
            "(?m)^\s*CXX\(target\)|^\s*CC\(target\)|^.*Building the projects in this solution"
          )
          foreach ($pattern in $sourceBuildEvidence) {
            if ($log -notmatch $pattern) {
              Write-Error "npm ci log is missing expected better-sqlite3 source-build evidence ($pattern); ADR 0016's build-from-source=true policy may not be taking effect"
              exit 1
            }
          }

      - name: CLI install smoke
        run: npm run smoke:cli-install
