# Release: build + validate the self-contained, per-platform GitHub Release CLI
# artifacts (decision: eshyra-upef / eshyra-0p8u).
#
# Each artifact bundles a pinned Node 24 runtime + the ABI-matched
# better-sqlite3 prebuild + the production app tree + bundled SRD data +
# license/notice files. Because the runtime and native binding must match the
# host ABI, every artifact is built ON its target platform -- the same
# host-targeted model the install-smoke job uses. dolt is NOT bundled (it stays
# lazy/self-provisioned).
#
# This workflow NEVER publishes to npm and never touches package `private`
# guards. On a version tag it creates (if needed) the GitHub Release and uploads
# the validated artifacts to it; otherwise it just builds, validates, and
# uploads CI artifacts.
#
# A scoped pull_request trigger runs the build+validate matrix whenever the
# release packaging inputs change, so release-path regressions are caught before
# merge. The validate-installer-scripts job also runs on PRs to confirm that
# install.sh, install.ps1, and sha256sums.txt are wired in correctly before any
# tag release. The release-attach job is tag-gated and never runs on pull_request.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "package.json"
      - "package-lock.json"
      - "packages/cli/package.json"
      - "packages/core/package.json"
      - "packages/core/data/rules-packs/**/manifest.json"

permissions:
  contents: read

jobs:
  build:
    name: Build artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners covering the target matrix:
        #   ubuntu-latest      -> linux-x64 (also the WSL target)
        #   ubuntu-24.04-arm   -> linux-arm64
        #   macos-14           -> darwin-arm64 (macOS latest, Apple Silicon)
        #   windows-latest     -> windows-x64
        # macOS is supported on Apple Silicon (arm64) only; we do not ship a
        # darwin-x64 build.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    env:
      # Keep prebuild-install on the prebuilt-first path (ADR 0008): the bundled
      # better-sqlite3 binding must be a downloaded prebuild, not a source build.
      npm_config_build_from_source: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release artifact
        run: npm run release:build

      - name: Validate release artifact
        run: npm run release:validate

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eshyra-cli-${{ matrix.os }}
          path: |
            dist-release/*.tar.gz
            dist-release/*.zip
            dist-release/*.json
          if-no-files-found: error

  validate-installer-scripts:
    # Lightweight check: verify installer scripts exist and reference the correct
    # artifact naming scheme (windows-x64, not win32-x64). Runs on PRs to catch
    # naming regressions before merge. This job is intentionally separate from
    # the tag-gated release job.
    name: Validate installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check installer scripts exist
        run: |
          set -euo pipefail
          for f in scripts/release/install.sh scripts/release/install.ps1 scripts/release/generate-checksums.mjs; do
            if [ ! -f "$f" ]; then
              echo "Missing required installer file: $f" >&2
              exit 1
            fi
          done
          echo "All installer script files present"

      - name: Check artifact naming (windows-x64, not win32-x64)
        run: |
          set -euo pipefail
          bad=0
          for f in scripts/release/install.sh scripts/release/install.ps1; do
            if grep -q 'win32-x64' "$f"; then
              echo "FAIL: $f references 'win32-x64' (must be 'windows-x64')" >&2
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "Artifact naming uses windows-x64 (correct)"

      - name: Check workflow references installer assets
        run: |
          set -euo pipefail
          wf=".github/workflows/release.yml"
          for asset in install.sh install.ps1 sha256sums.txt; do
            if ! grep -q "$asset" "$wf"; then
              echo "FAIL: $wf does not reference release asset: $asset" >&2
              exit 1
            fi
          done
          echo "Release workflow references all expected installer assets"

  installer-smoke:
    # Functional end-to-end check of the one-line POSIX installer against a
    # locally built artifact: build -> checksums -> install.sh (file:// base URL,
    # throwaway install root) -> assert checksum verified + no-config run works.
    # This covers the real install.sh path, which the build/validate matrix does
    # not (validate runs the artifact directly, not through the installer).
    name: Installer smoke (POSIX)
    runs-on: ubuntu-latest
    env:
      npm_config_build_from_source: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run installer smoke
        run: npm run release:smoke-installer

  release:
    name: Attach to GitHub Release
    # Gate publication on the per-platform build/validate matrix, the installer
    # script validation, AND the functional installer smoke, so a broken
    # installer can never ship attached to a tag release. Still tag-gated and
    # still never publishes to npm.
    needs: [build, validate-installer-scripts, installer-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Required to upload assets to the Release; still no npm publish anywhere.
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          # Collect all archives and metadata JSON sidecars from the build matrix.
          # sha256sums.txt format: "<sha256>  <filename>" (two spaces, standard
          # sha256sum/sha256sum --check format). Installer scripts verify this file.
          mapfile -t files < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.json' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release artifacts found" >&2
            exit 1
          fi
          : > sha256sums.txt
          for f in "${files[@]}"; do
            name=$(basename "$f")
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            printf '%s  %s\n' "$hash" "$name" >> sha256sums.txt
          done
          echo "Generated sha256sums.txt with ${#files[@]} entries:"
          cat sha256sums.txt

      - name: Create release if needed, then upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Collect all archives, JSON sidecars, checksums, and installer scripts.
          mapfile -t assets < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.json' \))
          assets+=(sha256sums.txt)
          assets+=(scripts/release/install.sh)
          assets+=(scripts/release/install.ps1)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets found" >&2
            exit 1
          fi

          # Create the Release if it does not already exist (idempotent on
          # re-run). --verify-tag refuses to invent a release for a tag that was
          # never pushed; --generate-notes fills the body from commit history.
          # No npm publish anywhere.
          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Creating release ${tag}"
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" \
              --verify-tag \
              --generate-notes
          else
            echo "Release ${tag} already exists; uploading assets"
          fi
          echo "Uploading ${#assets[@]} asset(s) to release ${tag}"
          gh release upload "${tag}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
